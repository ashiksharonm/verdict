name: keepwarm

# Free Hugging Face Spaces sleep after about 48 hours without traffic, and GitHub only guarantees
# best-effort cron timing; this ping keeps the Space awake in practice, it is not a guarantee.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    if: vars.KEEPWARM_ENABLED == 'true'  # set once the Space exists
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 10 --max-time 60 https://ashiksharon005-verdict-api.hf.space/healthz
