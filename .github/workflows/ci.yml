name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (no torch, no model downloads)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (data utils, metrics, fixture smoke eval)
        run: pytest -q
