[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "verdict-guardrails"
dynamic = ["version"]
description = "Python client for the Verdict guardrail API: PII, toxicity, prompt-injection and groundedness checks for LLM apps."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Ashik Sharon M" }]
keywords = ["llm", "guardrails", "pii", "toxicity", "prompt-injection", "groundedness", "hallucination", "safety", "verdict"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "pytest-cov>=4.1", "mypy>=1.8", "ruff>=0.4", "build", "twine>=5"]

[project.urls]
Homepage = "https://verdict-sooty-zeta.vercel.app"
Documentation = "https://github.com/ashiksharonm/verdict/blob/main/sdk/python/README.md"
Source = "https://github.com/ashiksharonm/verdict/tree/main/sdk/python"
Issues = "https://github.com/ashiksharonm/verdict/issues"
Changelog = "https://github.com/ashiksharonm/verdict/blob/main/sdk/python/CHANGELOG.md"
Model = "https://huggingface.co/ashiksharon005/verdict-laya"

[tool.hatch.version]
path = "src/verdict_guardrails/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/verdict_guardrails"]

[tool.hatch.build.targets.sdist]
include = ["src/verdict_guardrails", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q -m 'not live'"
markers = ["live: hits the deployed API; needs VERDICT_API_KEY (or VERDICT_LIVE=1 with ~/.verdict_test_key)"]

[tool.coverage.run]
source = ["verdict_guardrails"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mypy]
strict = true
files = ["src/verdict_guardrails"]
python_version = "3.9"

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045"]  # keep typing.List/Optional: needed for 3.9 runtime-safe aliases

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
