[project]
name = "verdict-sdk"
version = "0.1.0"
description = "Python client for the Verdict guardrail API (pii, toxicity, prompt injection, groundedness)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verdict"]
