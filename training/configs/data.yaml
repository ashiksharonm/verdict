seed: 13
checks:
  pii:
    train: {n: 8000, pos_frac: 0.5}
    val: {n: 600, pos_frac: 0.5}
    test: {n: 2000, pos_frac: 0.5}
  toxicity:
    train: {n: 8000, pos_frac: 0.5}
    val: {n: 600, pos_frac: 0.5}
    test: {n: 2000, pos_frac: 0.5}
  prompt_injection:
    train: {n: 8000, pos_frac: null}
